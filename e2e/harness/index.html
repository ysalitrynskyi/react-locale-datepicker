<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocaleDatePicker e2e harness</title>
    <style>
      /* Minimal reset so 320px layout tests are not skewed by UA margins. */
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        /* No outer padding: 320px viewport tests measure the popup against the
           true viewport edge without a harness-imposed inset. */
        padding: 0;
      }
      /* Stand-in for the Tailwind utilities the port still carries until D3.
         Enough for interaction tests; not a visual golden. */
      .relative {
        position: relative;
      }
      .w-full {
        width: 100%;
      }
      .flex {
        display: flex;
      }
      .items-center {
        align-items: center;
      }
      .justify-between {
        justify-content: space-between;
      }
      .justify-center {
        justify-content: center;
      }
      .grid {
        display: grid;
      }
      .grid-cols-7 {
        grid-template-columns: repeat(7, minmax(0, 1fr));
      }
      .grid-cols-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .absolute {
        position: absolute;
      }
      .z-50 {
        z-index: 50;
      }
      .hidden {
        display: none;
      }
      .rounded-md {
        border-radius: 0.375rem;
      }
      .rounded-lg {
        border-radius: 0.5rem;
      }
      .border,
      .border-2 {
        border-style: solid;
        border-width: 1px;
      }
      .border-2 {
        border-width: 2px;
      }
      .border-gray-200 {
        border-color: #e5e7eb;
      }
      .border-gray-300 {
        border-color: #d1d5db;
      }
      .border-blue-500 {
        border-color: #3b82f6;
      }
      .border-red-400 {
        border-color: #f87171;
      }
      .bg-white {
        background: #fff;
      }
      .bg-gray-50 {
        background: #f9fafb;
      }
      .bg-blue-50 {
        background: #eff6ff;
      }
      .bg-blue-600 {
        background: #2563eb;
      }
      .text-white {
        color: #fff;
      }
      .text-gray-400 {
        color: #9ca3af;
      }
      .text-gray-500 {
        color: #6b7280;
      }
      .text-gray-600 {
        color: #4b5563;
      }
      .text-gray-800 {
        color: #1f2937;
      }
      .text-gray-900 {
        color: #111827;
      }
      .text-blue-700 {
        color: #1d4ed8;
      }
      .text-xs {
        font-size: 0.75rem;
      }
      .text-sm {
        font-size: 0.875rem;
      }
      .text-base {
        font-size: 1rem;
      }
      .font-medium {
        font-weight: 500;
      }
      .font-semibold {
        font-weight: 600;
      }
      .uppercase {
        text-transform: uppercase;
      }
      .capitalize {
        text-transform: capitalize;
      }
      .p-0 {
        padding: 0;
      }
      .p-1 {
        padding: 0.25rem;
      }
      .p-3 {
        padding: 0.75rem;
      }
      .px-2 {
        padding-left: 0.5rem;
        padding-right: 0.5rem;
      }
      .px-2\.5 {
        padding-left: 0.625rem;
        padding-right: 0.625rem;
      }
      .py-2 {
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
      }
      .mb-1 {
        margin-bottom: 0.25rem;
      }
      .mb-2 {
        margin-bottom: 0.5rem;
      }
      .mt-0\.5 {
        margin-top: 0.125rem;
      }
      .mt-1 {
        margin-top: 0.25rem;
      }
      .ml-1 {
        margin-left: 0.25rem;
      }
      .gap-1 {
        gap: 0.25rem;
      }
      .gap-1\.5 {
        gap: 0.375rem;
      }
      .min-h-11 {
        min-height: 2.75rem;
      }
      .h-4 {
        height: 1rem;
      }
      .h-5 {
        height: 1.25rem;
      }
      .h-8 {
        height: 2rem;
      }
      .h-11 {
        height: 2.75rem;
      }
      .w-4 {
        width: 1rem;
      }
      .w-5 {
        width: 1.25rem;
      }
      .w-11 {
        width: 2.75rem;
      }
      .w-\[19\.5rem\] {
        width: 19.5rem;
      }
      .max-w-\[calc\(100vw-1rem\)\] {
        max-width: calc(100vw - 1rem);
      }
      .max-h-64 {
        max-height: 16rem;
      }
      .overflow-y-auto {
        overflow-y: auto;
      }
      .shrink-0 {
        flex-shrink: 0;
      }
      .shadow-xl {
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
      }
      .top-full {
        top: 100%;
      }
      .bottom-full {
        bottom: 100%;
      }
      .select-none {
        user-select: none;
      }
      .cursor-not-allowed {
        cursor: not-allowed;
      }
      .opacity-60 {
        opacity: 0.6;
      }
      .opacity-30 {
        opacity: 0.3;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .ring-1 {
        box-shadow: inset 0 0 0 1px #60a5fa;
      }
      [dir="rtl"] .rtl\:rotate-180 {
        transform: rotate(180deg);
      }
      @media (min-width: 768px) {
        .md\:h-9 {
          height: 2.25rem;
        }
        .md\:w-9 {
          width: 2.25rem;
        }
        .md\:min-h-9 {
          min-height: 2.25rem;
        }
        .md\:text-sm {
          font-size: 0.875rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
