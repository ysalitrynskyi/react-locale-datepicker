name: Feature request
description: Suggest a capability or an API change
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The design goal is a small, dependency-free component that gets
        localization right. Features that add dependencies or significant API
        surface face a high bar — that is deliberate, not dismissive.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How you work around it now
      description: If there is a workaround, that is useful for judging priority.

  - type: checkboxes
    id: constraints
    attributes:
      label: Please confirm
      options:
        - label: This does not require a new runtime dependency, or I have explained why one is unavoidable.
        - label: This does not break an existing documented contract in docs/API.md, or I have said which and why.
